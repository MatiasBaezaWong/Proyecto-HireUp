{% extends 'administrador/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-building"></i> Registrar Nueva Obra</h5>
        </div>
        <div class="card-body">
            <form method="POST" id="form-obra">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100">Guardar Obra</button>
            </form>
        </div>
    </div>    
    <div class="text-center mb-4 pt-5">
        <a href="{% url 'administrador:gestionar_obras' %}"
            class="btn btn-outline-success px-4 py-2 shadow-sm rounded-3">
            <i class="bi bi-arrow-left me-2"></i> Volver al Panel de Obras
        </a>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        $("#id_region").change(function () {
            var regionId = $(this).val();
            $.ajax({
                url: "{% url 'administrador:ajax_cargar_ciudades' %}",
                data: { region_id: regionId },
                success: function (data) {
                    $("#id_ciudad").html('<option value="">Seleccione una ciudad...</option>');
                    $("#id_comuna").html('<option value="">Seleccione una comuna...</option>');
                    $.each(data.ciudades, function (key, value) {
                        $("#id_ciudad").append('<option value="' + value.id + '">' + value.nombre + '</option>');
                    });
                }
            });
        });

        $("#id_ciudad").change(function () {
            var ciudadId = $(this).val();
            $.ajax({
                url: "{% url 'administrador:ajax_cargar_comunas' %}",
                data: { ciudad_id: ciudadId },
                success: function (data) {
                    $("#id_comuna").html('<option value="">Seleccione una comuna...</option>');
                    $.each(data.comunas, function (key, value) {
                        $("#id_comuna").append('<option value="' + value.id + '">' + value.nombre + '</option>');
                    });
                }
            });
        });
    });
</script>
{% endblock %}
