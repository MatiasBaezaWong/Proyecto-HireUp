{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ingreso al Portal</title>
  <link rel="icon" href="{% static 'images/logo.ico' %}" type="image/x-icon">
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
  <main class="container">
    <div class="login-card">    
      <h1>Inicio de Sesión</h1>

      <!-- Errores del formulario
      {% if form.errors %}
        <div class="alert alert-danger">
          <h4>⚠️ Error de autenticación</h4>
          <ul>
            {% for field, errors in form.errors.items %}
              {% for error in errors %}
                <li><strong>{{ field|capfirst }}:</strong> {{ error }}</li>
              {% endfor %}
            {% endfor %}
          </ul>
        </div>
      {% endif %} -->

      <!-- Mensajes de Django -->
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{{ m.tags }}">{{ m }}</div>
        {% endfor %}
      {% endif %}

      <!-- Formulario de login -->
      <form method="POST" class="form-login">
        {% csrf_token %}
        <div class="form-group">
          <input type="text" name="username" class="form-control" placeholder="Nombre de usuario o correo">
        </div>
        <div class="form-group">
          <input type="password" name="password" class="form-control" placeholder="Contraseña">
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <div class="register-link">
        <p>¿No tienes cuenta? <a href="{% url 'main:registro_candidato' %}">Regístrate aquí</a></p>
      </div>
      <div class="home-link">
        <a href="{% url 'home' %}" class="btn btn-secondary">Volver al Inicio</a>
      </div>
    </div>
  </main>
</body>
</html>
