{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HireUp - Plataforma de Reclutamiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{% static 'images/logo.ico' %}" type="image/x-icon">
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">
    <div class="container-fluid">
        <!-- Titulo -->
        <a class="navbar-brand fw-bold" href="{% url 'ofertas_laborales:vista_candidato' %}">HireUp - Plataforma de Reclutamiento</a>

        <!-- Menú desplegable -->
        <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userMenu" role="button"
                   data-bs-toggle="dropdown" aria-expanded="false">
                    👤 {{ request.user.username }}
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                    <li><a class="dropdown-item" href="{% url 'ofertas_laborales:perfil_candidato' %}">Mi perfil</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'main:logout' %}">Cerrar sesión</a></li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
